<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Inter', -apple-system, sans-serif;
    background: #0a2540;
  }

  .ad {
    position: relative;
    width: 1080px;
    height: 1080px;
    overflow: hidden;
  }

  /* ── Subtle gradient wash ───────────────────────────── */
  .bg-orb {
    position: absolute; border-radius: 50%; filter: blur(160px); pointer-events: none;
  }
  .bg-orb--1 { width: 600px; height: 600px; top: -100px; left: -100px; background: radial-gradient(circle, #635bff, transparent 70%); opacity: 0.3; }
  .bg-orb--2 { width: 400px; height: 400px; bottom: 50px; right: -50px; background: radial-gradient(circle, #80b3ff, transparent 70%); opacity: 0.25; }

  /* ── Phased steps — stepped gradient blocks ─────────── */
  .steps {
    position: absolute;
    bottom: 180px;
    right: 80px;
    z-index: 1;
    display: flex;
    align-items: flex-end;
    gap: 16px;
    height: 340px;
  }

  .step {
    width: 80px;
    border-radius: 8px 8px 0 0;
    position: relative;
  }
  .step::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    filter: blur(20px);
    opacity: 0.4;
  }

  .step:nth-child(1) {
    height: 25%;
    background: linear-gradient(180deg, #635bff 0%, rgba(99,91,255,0.3) 100%);
  }
  .step:nth-child(1)::after { background: #635bff; }

  .step:nth-child(2) {
    height: 45%;
    background: linear-gradient(180deg, #7471ff 0%, rgba(116,113,255,0.3) 100%);
  }
  .step:nth-child(2)::after { background: #7471ff; }

  .step:nth-child(3) {
    height: 65%;
    background: linear-gradient(180deg, #80b3ff 0%, rgba(128,179,255,0.3) 100%);
  }
  .step:nth-child(3)::after { background: #80b3ff; }

  .step:nth-child(4) {
    height: 85%;
    background: linear-gradient(180deg, #7dd3fc 0%, rgba(125,211,252,0.3) 100%);
  }
  .step:nth-child(4)::after { background: #7dd3fc; }

  .step:nth-child(5) {
    height: 100%;
    background: linear-gradient(180deg, #a5f3fc 0%, rgba(165,243,252,0.3) 100%);
  }
  .step:nth-child(5)::after { background: #a5f3fc; }

  /* Step labels */
  .step-labels {
    position: absolute;
    bottom: 140px;
    right: 80px;
    z-index: 2;
    display: flex;
    gap: 16px;
    width: calc(5 * 80px + 4 * 16px);
  }
  .step-label {
    width: 80px;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.5px;
  }

  /* ── Content ────────────────────────────────────────── */
  .content {
    position: relative;
    z-index: 3;
    padding: 72px 80px 64px;
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  .brand svg { height: 40px; fill: #fff; }
  .brand { margin-bottom: 80px; }

  .headline {
    font-size: 68px;
    font-weight: 800;
    color: #fff;
    line-height: 1.05;
    letter-spacing: -2px;
    max-width: 560px;
  }

  .subline {
    font-size: 21px;
    font-weight: 400;
    color: rgba(255,255,255,0.45);
    max-width: 440px;
    line-height: 1.5;
    margin-top: 24px;
  }

  .bottom {
    margin-top: auto;
  }
  .gradient-line {
    width: 100%; height: 3px;
    background: linear-gradient(90deg, #635bff, #80b3ff, #7dd3fc);
    border-radius: 2px; margin-bottom: 24px;
  }
  .subtext {
    font-size: 17px; font-weight: 500;
    color: rgba(255,255,255,0.4);
  }
</style>
</head>
<body>
<div class="ad">
  <div class="bg-orb bg-orb--1"></div>
  <div class="bg-orb bg-orb--2"></div>

  <div class="steps">
    <div class="step"></div>
    <div class="step"></div>
    <div class="step"></div>
    <div class="step"></div>
    <div class="step"></div>
  </div>
  <div class="step-labels">
    <div class="step-label">Week 1</div>
    <div class="step-label">Week 2</div>
    <div class="step-label">Week 4</div>
    <div class="step-label">Week 6</div>
    <div class="step-label">Done</div>
  </div>

  <div class="content">
    <div class="brand">
      <svg viewBox="0 0 60 25" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 10.2c0-.7.6-1 1.5-1 1.4 0 3.1.4 4.5 1.2V6.3C9.4 5.7 7.8 5.4 6.5 5.4 2.6 5.4 0 7.4 0 10.5c0 4.8 6.6 4 6.6 6.1 0 .8-.7 1.1-1.7 1.1-1.5 0-3.4-.6-4.9-1.5v4.2c1.7.7 3.3 1 4.9 1 4 0 6.7-2 6.7-5.1C11.6 11.1 5 12.1 5 10.2zM16.1 2.3l-4.6 1-.1 13.4c0 2.5 1.9 4.3 4.3 4.3 1.4 0 2.4-.3 2.9-.5v-3.6c-.5.2-3.2.9-3.2-1.4v-5.6h3.2V6.3h-3.2l-.3-4zM23.4 8.2l-.3-1.9h-4.1v14.1h4.7v-9.6c1.1-1.4 3-1.2 3.6-1V6.3c-.6-.2-2.9-.6-3.9 1.9zM28.8 6.3h4.7v14.1h-4.7zM28.8 5l4.7-1V.4l-4.7 1zM41 5.4c-1.8 0-2.9.8-3.5 1.4l-.2-1.1h-4.1v18.5l4.7-1v-4.5c.7.5 1.7 1.2 3.3 1.2 3.3 0 6.3-2.7 6.3-8.5-.1-5.4-3.1-6-6.5-6zM40 17c-1.1 0-1.7-.4-2.2-1V10c.5-.6 1.1-1 2.2-1 1.7 0 2.8 1.9 2.8 4s-1.1 4-2.8 4zM55.3 5.4c-4.5 0-7.3 3.5-7.3 8.5 0 5.6 3.2 8.1 7.8 8.1 2.3 0 4-.5 5.2-1.2v-3.5c-1.3.6-2.7 1-4.5 1-1.8 0-3.3-.6-3.5-2.8h8.8c0-.2.1-1.3.1-1.7-.1-5.2-2.5-8.4-6.6-8.4zm-2.6 6.8c0-2 1.3-2.9 2.4-2.9s2.3.9 2.3 2.9h-4.7z"/>
      </svg>
    </div>
    <div class="headline" id="headline"></div>
    <div class="subline" id="subline"></div>
    <div class="bottom">
      <div class="gradient-line"></div>
      <div class="subtext" id="subtext">stripe.com/migrate</div>
    </div>
  </div>
</div>
</body>
</html>
