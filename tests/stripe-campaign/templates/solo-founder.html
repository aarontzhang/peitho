<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Inter', -apple-system, sans-serif;
    background: #0a2540;
  }

  .ad {
    position: relative;
    width: 1080px;
    height: 1080px;
    overflow: hidden;
  }

  /* ── Warm gradient wash ─────────────────────────────── */
  .bg-orb {
    position: absolute; border-radius: 50%; filter: blur(150px); pointer-events: none;
  }
  .bg-orb--1 { width: 550px; height: 550px; bottom: -50px; right: -50px; background: radial-gradient(circle, #635bff, transparent 70%); opacity: 0.35; }
  .bg-orb--2 { width: 400px; height: 400px; top: 100px; left: -100px; background: radial-gradient(circle, #7dd3fc, transparent 70%); opacity: 0.15; }

  /* ── Payment notification card ──────────────────────── */
  .notification {
    position: absolute;
    right: 80px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 2;
    width: 380px;
  }

  .notif-card {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 40px;
    backdrop-filter: blur(20px);
  }

  .notif-icon {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, #635bff, #80b3ff);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 28px;
    box-shadow: 0 0 40px rgba(99,91,255,0.4);
  }

  .notif-icon svg {
    width: 28px;
    height: 28px;
    fill: #fff;
  }

  .notif-label {
    font-size: 15px;
    font-weight: 600;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 8px;
  }

  .notif-amount {
    font-size: 56px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -2px;
    line-height: 1;
    margin-bottom: 20px;
  }

  .notif-details {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-top: 20px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }

  .notif-detail {
    display: flex;
    justify-content: space-between;
    font-size: 15px;
  }

  .notif-detail-key {
    color: rgba(255,255,255,0.35);
    font-weight: 500;
  }

  .notif-detail-val {
    color: rgba(255,255,255,0.7);
    font-weight: 600;
  }

  .notif-status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 20px;
    font-size: 14px;
    font-weight: 600;
    color: #34d399;
    background: rgba(52,211,153,0.1);
    padding: 6px 14px;
    border-radius: 20px;
  }

  .notif-status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #34d399;
    box-shadow: 0 0 8px #34d399;
  }

  /* ── Content ────────────────────────────────────────── */
  .content {
    position: relative;
    z-index: 3;
    padding: 72px 80px 64px;
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  .brand svg { height: 40px; fill: #fff; }
  .brand { margin-bottom: 80px; }

  .headline {
    font-size: 72px;
    font-weight: 800;
    color: #fff;
    line-height: 1.05;
    letter-spacing: -2px;
    max-width: 500px;
  }

  .subline {
    font-size: 21px;
    font-weight: 400;
    color: rgba(255,255,255,0.45);
    max-width: 420px;
    line-height: 1.5;
    margin-top: 24px;
  }

  .bottom {
    margin-top: auto;
  }
  .gradient-line {
    width: 100%; height: 3px;
    background: linear-gradient(90deg, #635bff, #80b3ff, #7dd3fc);
    border-radius: 2px; margin-bottom: 24px;
  }
  .subtext {
    font-size: 17px; font-weight: 500;
    color: rgba(255,255,255,0.4);
  }
</style>
</head>
<body>
<div class="ad">
  <div class="bg-orb bg-orb--1"></div>
  <div class="bg-orb bg-orb--2"></div>

  <div class="notification">
    <div class="notif-card">
      <div class="notif-icon">
        <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
      </div>
      <div class="notif-label">Payment received</div>
      <div class="notif-amount">$49.00</div>
      <div class="notif-details">
        <div class="notif-detail">
          <span class="notif-detail-key">Customer</span>
          <span class="notif-detail-val">sarah@hey.com</span>
        </div>
        <div class="notif-detail">
          <span class="notif-detail-key">Product</span>
          <span class="notif-detail-val">Pro plan</span>
        </div>
        <div class="notif-detail">
          <span class="notif-detail-key">Method</span>
          <span class="notif-detail-val">Visa ****4242</span>
        </div>
      </div>
      <div class="notif-status">
        <span class="notif-status-dot"></span>
        Succeeded
      </div>
    </div>
  </div>

  <div class="content">
    <div class="brand">
      <svg viewBox="0 0 60 25" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 10.2c0-.7.6-1 1.5-1 1.4 0 3.1.4 4.5 1.2V6.3C9.4 5.7 7.8 5.4 6.5 5.4 2.6 5.4 0 7.4 0 10.5c0 4.8 6.6 4 6.6 6.1 0 .8-.7 1.1-1.7 1.1-1.5 0-3.4-.6-4.9-1.5v4.2c1.7.7 3.3 1 4.9 1 4 0 6.7-2 6.7-5.1C11.6 11.1 5 12.1 5 10.2zM16.1 2.3l-4.6 1-.1 13.4c0 2.5 1.9 4.3 4.3 4.3 1.4 0 2.4-.3 2.9-.5v-3.6c-.5.2-3.2.9-3.2-1.4v-5.6h3.2V6.3h-3.2l-.3-4zM23.4 8.2l-.3-1.9h-4.1v14.1h4.7v-9.6c1.1-1.4 3-1.2 3.6-1V6.3c-.6-.2-2.9-.6-3.9 1.9zM28.8 6.3h4.7v14.1h-4.7zM28.8 5l4.7-1V.4l-4.7 1zM41 5.4c-1.8 0-2.9.8-3.5 1.4l-.2-1.1h-4.1v18.5l4.7-1v-4.5c.7.5 1.7 1.2 3.3 1.2 3.3 0 6.3-2.7 6.3-8.5-.1-5.4-3.1-6-6.5-6zM40 17c-1.1 0-1.7-.4-2.2-1V10c.5-.6 1.1-1 2.2-1 1.7 0 2.8 1.9 2.8 4s-1.1 4-2.8 4zM55.3 5.4c-4.5 0-7.3 3.5-7.3 8.5 0 5.6 3.2 8.1 7.8 8.1 2.3 0 4-.5 5.2-1.2v-3.5c-1.3.6-2.7 1-4.5 1-1.8 0-3.3-.6-3.5-2.8h8.8c0-.2.1-1.3.1-1.7-.1-5.2-2.5-8.4-6.6-8.4zm-2.6 6.8c0-2 1.3-2.9 2.4-2.9s2.3.9 2.3 2.9h-4.7z"/>
      </svg>
    </div>
    <div class="headline" id="headline"></div>
    <div class="subline" id="subline"></div>
    <div class="bottom">
      <div class="gradient-line"></div>
      <div class="subtext" id="subtext">stripe.com/payments</div>
    </div>
  </div>
</div>
</body>
</html>
