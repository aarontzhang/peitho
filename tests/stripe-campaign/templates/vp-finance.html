<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Inter', -apple-system, sans-serif;
    background: #0a2540;
  }

  .ad {
    position: relative;
    width: 1080px;
    height: 1080px;
    overflow: hidden;
  }

  /* ── Soft gradient background ───────────────────────── */
  .bg-orb {
    position: absolute; border-radius: 50%; filter: blur(180px); pointer-events: none;
  }
  .bg-orb--1 { width: 500px; height: 500px; top: -80px; right: 100px; background: radial-gradient(circle, #635bff, transparent 70%); opacity: 0.2; }
  .bg-orb--2 { width: 400px; height: 400px; bottom: 100px; left: -50px; background: radial-gradient(circle, #80b3ff, transparent 70%); opacity: 0.15; }

  /* ── Metrics visualization — abstract dashboard bars ── */
  .metrics {
    position: absolute;
    right: 80px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 20px;
    width: 420px;
  }

  .metric-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .metric-label {
    font-size: 14px;
    font-weight: 600;
    color: rgba(255,255,255,0.35);
    width: 100px;
    text-align: right;
    letter-spacing: 0.3px;
  }

  .metric-bar-track {
    flex: 1;
    height: 32px;
    background: rgba(255,255,255,0.04);
    border-radius: 6px;
    overflow: hidden;
    position: relative;
  }

  .metric-bar-fill {
    height: 100%;
    border-radius: 6px;
    position: relative;
  }
  .metric-bar-fill::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    filter: blur(8px);
    opacity: 0.5;
  }

  .metric-row:nth-child(1) .metric-bar-fill {
    width: 92%;
    background: linear-gradient(90deg, #635bff, #80b3ff);
  }
  .metric-row:nth-child(1) .metric-bar-fill::after { background: #635bff; }

  .metric-row:nth-child(2) .metric-bar-fill {
    width: 78%;
    background: linear-gradient(90deg, #7471ff, #7dd3fc);
  }
  .metric-row:nth-child(2) .metric-bar-fill::after { background: #7471ff; }

  .metric-row:nth-child(3) .metric-bar-fill {
    width: 85%;
    background: linear-gradient(90deg, #80b3ff, #a5f3fc);
  }
  .metric-row:nth-child(3) .metric-bar-fill::after { background: #80b3ff; }

  .metric-row:nth-child(4) .metric-bar-fill {
    width: 95%;
    background: linear-gradient(90deg, #635bff, #7dd3fc);
  }
  .metric-row:nth-child(4) .metric-bar-fill::after { background: #635bff; }

  .metric-row:nth-child(5) .metric-bar-fill {
    width: 70%;
    background: linear-gradient(90deg, #7471ff, #80b3ff);
  }
  .metric-row:nth-child(5) .metric-bar-fill::after { background: #7471ff; }

  /* Metric values at end of bars */
  .metric-value {
    font-size: 15px;
    font-weight: 700;
    color: rgba(255,255,255,0.6);
    min-width: 50px;
  }

  /* ── Big stat callout ───────────────────────────────── */
  .stat {
    position: absolute;
    left: 80px;
    bottom: 200px;
    z-index: 2;
  }

  .stat-number {
    font-size: 110px;
    font-weight: 800;
    letter-spacing: -4px;
    line-height: 1;
    background: linear-gradient(135deg, #635bff 0%, #80b3ff 50%, #7dd3fc 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .stat-label {
    font-size: 20px;
    font-weight: 500;
    color: rgba(255,255,255,0.45);
    margin-top: 8px;
    letter-spacing: 0.3px;
  }

  /* ── Content ────────────────────────────────────────── */
  .content {
    position: relative;
    z-index: 3;
    padding: 72px 80px 64px;
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  .brand svg { height: 40px; fill: #fff; }
  .brand { margin-bottom: 80px; }

  .headline {
    font-size: 64px;
    font-weight: 800;
    color: #fff;
    line-height: 1.08;
    letter-spacing: -2px;
    max-width: 520px;
  }

  .subline {
    font-size: 21px;
    font-weight: 400;
    color: rgba(255,255,255,0.45);
    max-width: 440px;
    line-height: 1.5;
    margin-top: 24px;
  }

  .bottom {
    margin-top: auto;
  }
  .gradient-line {
    width: 100%; height: 3px;
    background: linear-gradient(90deg, #635bff, #80b3ff, #7dd3fc);
    border-radius: 2px; margin-bottom: 24px;
  }
  .subtext {
    font-size: 17px; font-weight: 500;
    color: rgba(255,255,255,0.4);
  }
</style>
</head>
<body>
<div class="ad">
  <div class="bg-orb bg-orb--1"></div>
  <div class="bg-orb bg-orb--2"></div>

  <div class="metrics">
    <div class="metric-row">
      <div class="metric-label">Reconciliation</div>
      <div class="metric-bar-track"><div class="metric-bar-fill"></div></div>
      <div class="metric-value">-92%</div>
    </div>
    <div class="metric-row">
      <div class="metric-label">Disputes</div>
      <div class="metric-bar-track"><div class="metric-bar-fill"></div></div>
      <div class="metric-value">-78%</div>
    </div>
    <div class="metric-row">
      <div class="metric-label">Reporting</div>
      <div class="metric-bar-track"><div class="metric-bar-fill"></div></div>
      <div class="metric-value">-85%</div>
    </div>
    <div class="metric-row">
      <div class="metric-label">Compliance</div>
      <div class="metric-bar-track"><div class="metric-bar-fill"></div></div>
      <div class="metric-value">Auto</div>
    </div>
    <div class="metric-row">
      <div class="metric-label">Rev rec</div>
      <div class="metric-bar-track"><div class="metric-bar-fill"></div></div>
      <div class="metric-value">-70%</div>
    </div>
  </div>

  <div class="content">
    <div class="brand">
      <svg viewBox="0 0 60 25" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 10.2c0-.7.6-1 1.5-1 1.4 0 3.1.4 4.5 1.2V6.3C9.4 5.7 7.8 5.4 6.5 5.4 2.6 5.4 0 7.4 0 10.5c0 4.8 6.6 4 6.6 6.1 0 .8-.7 1.1-1.7 1.1-1.5 0-3.4-.6-4.9-1.5v4.2c1.7.7 3.3 1 4.9 1 4 0 6.7-2 6.7-5.1C11.6 11.1 5 12.1 5 10.2zM16.1 2.3l-4.6 1-.1 13.4c0 2.5 1.9 4.3 4.3 4.3 1.4 0 2.4-.3 2.9-.5v-3.6c-.5.2-3.2.9-3.2-1.4v-5.6h3.2V6.3h-3.2l-.3-4zM23.4 8.2l-.3-1.9h-4.1v14.1h4.7v-9.6c1.1-1.4 3-1.2 3.6-1V6.3c-.6-.2-2.9-.6-3.9 1.9zM28.8 6.3h4.7v14.1h-4.7zM28.8 5l4.7-1V.4l-4.7 1zM41 5.4c-1.8 0-2.9.8-3.5 1.4l-.2-1.1h-4.1v18.5l4.7-1v-4.5c.7.5 1.7 1.2 3.3 1.2 3.3 0 6.3-2.7 6.3-8.5-.1-5.4-3.1-6-6.5-6zM40 17c-1.1 0-1.7-.4-2.2-1V10c.5-.6 1.1-1 2.2-1 1.7 0 2.8 1.9 2.8 4s-1.1 4-2.8 4zM55.3 5.4c-4.5 0-7.3 3.5-7.3 8.5 0 5.6 3.2 8.1 7.8 8.1 2.3 0 4-.5 5.2-1.2v-3.5c-1.3.6-2.7 1-4.5 1-1.8 0-3.3-.6-3.5-2.8h8.8c0-.2.1-1.3.1-1.7-.1-5.2-2.5-8.4-6.6-8.4zm-2.6 6.8c0-2 1.3-2.9 2.4-2.9s2.3.9 2.3 2.9h-4.7z"/>
      </svg>
    </div>
    <div class="headline" id="headline"></div>
    <div class="subline" id="subline"></div>
    <div class="bottom">
      <div class="gradient-line"></div>
      <div class="subtext" id="subtext">stripe.com/payments</div>
    </div>
  </div>
</div>
</body>
</html>
