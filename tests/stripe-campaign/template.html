<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0a2540;
  }

  .ad {
    position: relative;
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 72px 80px 64px;
  }

  /* ── Gradient mesh background ─────────────────────────── */

  .ad__gradient-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.35;
    pointer-events: none;
  }

  .ad__gradient-orb--purple {
    width: 600px;
    height: 600px;
    top: -120px;
    right: -100px;
    background: radial-gradient(circle, #635bff 0%, transparent 70%);
  }

  .ad__gradient-orb--blue {
    width: 500px;
    height: 500px;
    bottom: -80px;
    left: -60px;
    background: radial-gradient(circle, #80b3ff 0%, transparent 70%);
  }

  .ad__gradient-orb--teal {
    width: 400px;
    height: 400px;
    bottom: 100px;
    right: 60px;
    background: radial-gradient(circle, #7dd3fc 0%, transparent 70%);
    opacity: 0.2;
  }

  /* ── Stripe wordmark ──────────────────────────────────── */

  .ad__brand {
    position: relative;
    z-index: 2;
    margin-bottom: 64px;
  }

  .ad__brand svg {
    height: 40px;
    fill: #fff;
  }

  /* ── Headline ─────────────────────────────────────────── */

  .ad__headline {
    position: relative;
    z-index: 2;
    font-size: 64px;
    font-weight: 700;
    color: #fff;
    line-height: 1.1;
    letter-spacing: -1.5px;
    max-width: 780px;
    margin-bottom: auto;
  }

  .ad__headline em {
    font-style: normal;
    background: linear-gradient(135deg, #635bff 0%, #80b3ff 50%, #7dd3fc 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* ── Code block ───────────────────────────────────────── */

  .ad__code-block {
    position: relative;
    z-index: 2;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 32px 36px;
    margin-bottom: 48px;
    font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
    font-size: 20px;
    line-height: 1.65;
    color: rgba(255, 255, 255, 0.75);
    overflow: hidden;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .ad__code-block .comment { color: rgba(255, 255, 255, 0.3); }
  .ad__code-block .keyword { color: #7dd3fc; }
  .ad__code-block .string  { color: #80b3ff; }
  .ad__code-block .method  { color: #c4b5fd; }
  .ad__code-block .number  { color: #fbbf24; }
  .ad__code-block .punct   { color: rgba(255, 255, 255, 0.4); }

  /* ── Stat block (for non-technical personas) ──────────── */

  .ad__stat-block {
    position: relative;
    z-index: 2;
    margin-bottom: 48px;
  }

  .ad__stat-number {
    font-size: 96px;
    font-weight: 800;
    letter-spacing: -3px;
    line-height: 1;
    background: linear-gradient(135deg, #635bff 0%, #80b3ff 50%, #7dd3fc 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
  }

  .ad__stat-label {
    font-size: 24px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.55);
    letter-spacing: 0.5px;
  }

  /* ── Bottom bar: gradient accent line + subtext ───────── */

  .ad__bottom {
    position: relative;
    z-index: 2;
  }

  .ad__gradient-line {
    width: 100%;
    height: 3px;
    background: linear-gradient(90deg, #635bff 0%, #80b3ff 40%, #7dd3fc 100%);
    border-radius: 2px;
    margin-bottom: 24px;
  }

  .ad__subtext {
    font-size: 18px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.45);
    letter-spacing: 0.3px;
  }
</style>
</head>
<body>
  <div class="ad">
    <!-- Gradient background orbs -->
    <div class="ad__gradient-orb ad__gradient-orb--purple"></div>
    <div class="ad__gradient-orb ad__gradient-orb--blue"></div>
    <div class="ad__gradient-orb ad__gradient-orb--teal"></div>

    <!-- Stripe wordmark -->
    <div class="ad__brand">
      <svg viewBox="0 0 60 25" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 10.2c0-.7.6-1 1.5-1 1.4 0 3.1.4 4.5 1.2V6.3C9.4 5.7 7.8 5.4 6.5 5.4 2.6 5.4 0 7.4 0 10.5c0 4.8 6.6 4 6.6 6.1 0 .8-.7 1.1-1.7 1.1-1.5 0-3.4-.6-4.9-1.5v4.2c1.7.7 3.3 1 4.9 1 4 0 6.7-2 6.7-5.1C11.6 11.1 5 12.1 5 10.2zM16.1 2.3l-4.6 1-.1 13.4c0 2.5 1.9 4.3 4.3 4.3 1.4 0 2.4-.3 2.9-.5v-3.6c-.5.2-3.2.9-3.2-1.4v-5.6h3.2V6.3h-3.2l-.3-4zM23.4 8.2l-.3-1.9h-4.1v14.1h4.7v-9.6c1.1-1.4 3-1.2 3.6-1V6.3c-.6-.2-2.9-.6-3.9 1.9zM28.8 6.3h4.7v14.1h-4.7zM28.8 5l4.7-1V.4l-4.7 1zM41 5.4c-1.8 0-2.9.8-3.5 1.4l-.2-1.1h-4.1v18.5l4.7-1v-4.5c.7.5 1.7 1.2 3.3 1.2 3.3 0 6.3-2.7 6.3-8.5-.1-5.4-3.1-6-6.5-6zM40 17c-1.1 0-1.7-.4-2.2-1V10c.5-.6 1.1-1 2.2-1 1.7 0 2.8 1.9 2.8 4s-1.1 4-2.8 4zM55.3 5.4c-4.5 0-7.3 3.5-7.3 8.5 0 5.6 3.2 8.1 7.8 8.1 2.3 0 4-.5 5.2-1.2v-3.5c-1.3.6-2.7 1-4.5 1-1.8 0-3.3-.6-3.5-2.8h8.8c0-.2.1-1.3.1-1.7-.1-5.2-2.5-8.4-6.6-8.4zm-2.6 6.8c0-2 1.3-2.9 2.4-2.9s2.3.9 2.3 2.9h-4.7z"/>
      </svg>
    </div>

    <!-- Headline — injected by pipeline -->
    <div class="ad__headline" id="headline"></div>

    <!-- Code block — shown for technical personas -->
    <div class="ad__code-block" id="codeBlock"></div>

    <!-- Stat block — shown for non-technical personas (hidden by default) -->
    <!-- <div class="ad__stat-block">
      <div class="ad__stat-number" id="statNumber"></div>
      <div class="ad__stat-label" id="statLabel"></div>
    </div> -->

    <!-- Bottom accent -->
    <div class="ad__bottom">
      <div class="ad__gradient-line"></div>
      <div class="ad__subtext" id="subtext">stripe.com/payments</div>
    </div>
  </div>
</body>
</html>
